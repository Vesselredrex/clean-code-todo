<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Todo App</title>
    <link
      href="https://fonts.googleapis.com/css?family=Lato:300,400,700"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="style.css" media="screen" />
  </head>
  <body>
    <div class="aaa">
      <img
        src="./eisenhower-matrix.jpg"
        alt="Eisenhower matrix for prioritizing tasks by urgency and importance"
      />
      <a
        class="more_inf"
        href="https://goal-life.com/page/method/matrix-eisenhower"
        >Want more details?</a
      >
    </div>
    <main class="centered-main-page-element">
      <div id="topSectionForAddingElementToList">
        <label for="new-task">Add Item</label>
        <div class="task-row-wrapper">
          <input id="new-task" class="task" type="text" />
          <button type="button">Add</button>
        </div>
      </div>
      <h3>Todo</h3>
      <ul id="incompleteTasks">
        <li>
          <input
            id="pay-bills"
            type="checkbox"
            aria-label="Mark Pay Bills as completed"
          />
          <label class="task" for="pay-bills">Pay Bills</label>
          <input type="text" class="task" aria-label="Edit Pay Bills" />
          <button type="button" class="edit">Edit</button>
          <button type="button" class="delete" aria-label="Delete task">
            <img src="./remove.svg" alt="" />
          </button>
        </li>
        <li class="editMode">
          <input
            id="go-shopping"
            type="checkbox"
            aria-label="Mark Go Shopping as completed"
          />
          <label class="task" for="go-shopping">Go Shopping</label>
          <input
            type="text"
            value="Go Shopping"
            class="task"
            aria-label="Edit Go Shopping"
          />
          <button type="button" class="edit">Save</button>
          <button type="button" class="delete" aria-label="Delete task">
            <img src="./remove.svg" alt="" />
          </button>
        </li>
      </ul>
      <h3>Completed</h3>
      <ul id="completed-tasks">
        <li>
          <input
            id="see-doctor"
            type="checkbox"
            checked
            aria-label="Mark See the Doctor as incomplete"
          />
          <label class="task" for="see-doctor">See the Doctor</label>
          <input type="text" class="task" aria-label="Edit See the Doctor" />
          <button type="button" class="edit">Edit</button>
          <button type="button" class="delete" aria-label="Delete task">
            <img src="./remove.svg" alt="" />
          </button>
        </li>
      </ul>
    </main>
    <script src="app.js"></script>
  </body>
</html>
